name: Importa sito pubblicato
on:
  push:
    branches: [claude/import-sito]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scarica i file pubblicati e verifica che siano identici
        run: |
          set -euo pipefail
          while read -r path sha url; do
            mkdir -p "src/$(dirname "$path")"
            curl -fsSL --retry 3 "$url" -o "src/$path"
            echo "$sha  src/$path" | sha1sum -c -
          done <<'LIST'
          index.html 1b7ed1e3f3a37b5a8d6797587bafb8603322f912 https://24pet.it/index.html
          condizioni-v1/index.html 9a6e2ecb466e449e343bdd96846e03bcbcbdc380 https://24pet.it/condizioni-v1/index.html
          area-riservata/index.html a49843738ee50ad1ff3223fe572aa118908dfb33 https://24pet.it/area-riservata/index.html
          assets/calco.jpg 8fd8f4a2d3314caf6d0c0a472cd2c310de1b664b https://24pet.it/assets/calco.jpg
          assets/cane.jpg 1b9b5d692d4ff08056d33a17b275941f917f2d8d https://24pet.it/assets/cane.jpg
          assets/collezione.jpg e059bbbc73720a881fcdae784c180ec155450785 https://24pet.it/assets/collezione.jpg
          assets/cubo.jpg 825a1ba9d9fb3289d8db09e82a481e65ead4328d https://24pet.it/assets/cubo.jpg
          assets/cuore.jpg e14d299485123edc902925dcb9fdf1e5a3a39b99 https://24pet.it/assets/cuore.jpg
          assets/favicon-24pet.png aa36e2fb79a2abe2c95e8863e1191349255280de https://24pet.it/assets/favicon-24pet.png
          assets/gatto.jpg 312ea12fa6ff4d87cf6882368057602a07e43471 https://24pet.it/assets/gatto.jpg
          assets/hero-urna-quadro-1024.webp f5f4ee6e518d9896a1b7cb2e201841f0f17ed504 https://24pet.it/assets/hero-urna-quadro-1024.webp
          assets/hero-urna-quadro.webp 0e0bb06343507b12abbe04dd5c1c8afdd146c8a8 https://24pet.it/assets/hero-urna-quadro.webp
          assets/hero-urne-1536.webp d66173d8f8825085c2822b8b85992f92125390c1 https://24pet.it/assets/hero-urne-1536.webp
          assets/hero-urne-768.webp d29a615d4562f6fb96e0a8e9ac0e61ef9729c2f1 https://24pet.it/assets/hero-urne-768.webp
          assets/landing.css 5582da7e52d30dfe1ba5fd18002491a221f0cbfa https://24pet.it/assets/landing.css
          assets/logo-24pet.png fa177044dcf668988b8ddfee8330a7923eedf23d https://24pet.it/assets/logo-24pet.png
          assets/ottagonale.jpg 3c35fb8bf97bcd24495c34e6f029091009ff377b https://24pet.it/assets/ottagonale.jpg
          assets/quadro.jpg f987491f2b672c415c72d595454d8b5cbde54c7d https://24pet.it/assets/quadro.jpg
          assets/sfera.jpg e16da60589283b54998375e8ac0624531d74cee2 https://24pet.it/assets/sfera.jpg
          assets/urn-details.css d4a1a81f7662954716090c19cda44f6c1fe14467 https://24pet.it/assets/urn-details.css
          LIST
      - name: Salva i file nel ramo e rimuovi questo workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q .github/workflows/import-sito.yml
          git add src
          git commit -m "Importa il sito pubblicato su Vercel (deploy dpl_DVeLmdRH17epeBFXojwQN9BUoGcs)"
          git push
